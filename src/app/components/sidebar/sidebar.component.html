<div class="sidebar glass-panel">
  <div class="sidebar-header">
    <div class="brand">
      <div class="brand-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
      </div>
      <div>
        <h2>DevLens</h2>
        <p class="subtitle">AI Code Explorer</p>
      </div>
    </div>
  </div>

  <div class="projects-section">
    <div class="section-title">
      <h3>Projects</h3>
      <button class="btn btn-primary btn-icon" (click)="toggleNewProject()" [class.active]="showNewProject()">
        <svg *ngIf="!showNewProject()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        <svg *ngIf="showNewProject()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <div class="new-project-form" [class.show]="showNewProject()">
      <div class="form-content">
        <input type="text" class="input-field" placeholder="Project Name" [(ngModel)]="newProjectName">
        <input type="text" class="input-field" placeholder="Absolute Path or GitHub URL" [(ngModel)]="newProjectPath">
        <small class="help-text" style="color: #888; font-size: 0.8em; margin-bottom: 10px; display: block; padding-left: 8px;">e.g. https://github.com/Mirza-Umer/devlens</small>
        <div class="form-actions">
          <button class="btn btn-secondary" (click)="toggleNewProject()">Cancel</button>
          <button class="btn btn-primary" (click)="addProject()" [disabled]="!newProjectName || !newProjectPath">Save</button>
        </div>
      </div>
    </div>

    <ul class="project-list">
      <li *ngFor="let p of projects(); let i = index" 
          class="project-item" 
          [style.animation-delay]="i * 0.05 + 's'"
          [class.active]="selectedProject()?.id === p.id"
          (click)="selectProject(p)">
        
        <div class="project-indicator"></div>
        <div class="project-info">
          <span class="project-name">{{ p.name }}</span>
          <span class="project-path">{{ p.path }}</span>
        </div>
        
        <div class="project-actions">
          <button class="action-btn delete-btn" (click)="deleteProject(p.id, $event)" title="Delete Project">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          </button>
        </div>
      </li>
    </ul>
  </div>

  <div class="sidebar-footer" *ngIf="authService.currentUser$ | async as user">
    <div class="user-profile">
      <div class="user-avatar">
        {{ (user.name ? user.name.charAt(0) : (user.email ? user.email.charAt(0) : 'U')) | uppercase }}
      </div>
      <div class="user-info">
        <span class="user-name" [title]="user.name || user.email">{{ user.name || user.email }}</span>
        <span class="user-role">{{ user.role === 'admin' ? 'Admin' : 'Developer' }}</span>
      </div>
    </div>
    
    <div class="footer-actions">
      <button class="action-btn" (click)="goHome()" title="Dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      </button>

      <button *ngIf="user.role === 'admin'" class="action-btn" [routerLink]="['/admin']" title="Admin Panel">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>
      </button>

      <button class="action-btn logout-btn" (click)="logout()" title="Logout">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
      </button>
    </div>
  </div>
</div>
