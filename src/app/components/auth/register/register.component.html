<div class="auth-container">
  <div class="auth-box">
    <div class="auth-header">
      <h1>Create Account</h1>
      <p>Join DevLens to get started</p>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label for="name">Name</label>
        <input 
          id="name" 
          type="text" 
          formControlName="name" 
          placeholder="John Doe"
          [class.invalid]="registerForm.get('name')?.invalid && registerForm.get('name')?.touched"
        >
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input 
          id="email" 
          type="email" 
          formControlName="email" 
          placeholder="you@example.com"
          [class.invalid]="registerForm.get('email')?.invalid && registerForm.get('email')?.touched"
        >
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input 
          id="password" 
          type="password" 
          formControlName="password" 
          placeholder="At least 6 characters"
          [class.invalid]="registerForm.get('password')?.invalid && registerForm.get('password')?.touched"
        >
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input 
          id="confirmPassword" 
          type="password" 
          formControlName="confirmPassword" 
          placeholder="Confirm your password"
          [class.invalid]="registerForm.hasError('mismatch') && registerForm.get('confirmPassword')?.touched"
        >
        <div class="error-message" *ngIf="registerForm.hasError('mismatch') && registerForm.get('confirmPassword')?.touched" style="text-align: left; margin-top: 5px; font-size: 12px;">
          Passwords do not match
        </div>
      </div>

      <div class="error-message" *ngIf="error">
        {{ error }}
      </div>

      <button type="submit" class="submit-btn" [disabled]="registerForm.invalid || loading">
        <span *ngIf="!loading">Sign Up</span>
        <span *ngIf="loading" class="spinner"></span>
      </button>

      <div class="auth-footer">
        <p>Already have an account? <a routerLink="/login">Sign in</a></p>
      </div>
    </form>
  </div>
</div>
